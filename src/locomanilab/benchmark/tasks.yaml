# Benchmark task table: the closed-loop evaluation settings of every benchmark task.
#
# `lab eval --task <name>` and `lab eval --task-set <selection>` fill the eval options
# from this table (options given on the command line win); `lab tasks` lists it.
# Task names match the dataset directories (<type>/<split>/<name>). Every episode i
# starts from the fixed scene with reset jitter seeded by jitter_seed + i.

schema_version: 1
defaults:
  robot: G1FloatingBody
  backend: sonic
  sonic_ckpt: v1_1
  scene_seed: 0
  reset_jitter: 0.05
