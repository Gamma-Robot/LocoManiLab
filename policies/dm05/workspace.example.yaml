# Copy to workspaces/dm05/env.local.yaml from the LocoManiLab checkout root.
# Moving this file elsewhere requires adjusting repos.* to your own checkouts.
schema_version: 2
role: [data, train, eval]
repos:
  opendm: ../../external/opendm
  # Optional simulation/controller sources; unused by the CPU walkthrough.
  sim_repo: ../../external/humanoid_benchmark
  g1_backend: ../../external/g1_backend
paths:
  dm05_data_root: datasets/opendm
  dm05_pretrained: assets/DM05-sonic78
  dm05_outputs: outputs/dm05
  logs: runs
deploy: {}
conda_envs:
  dm05: opendm
