# Copy to workspaces/act/env.local.yaml from the LocoManiLab checkout root.
# Moving this file elsewhere requires adjusting repos.* to your own checkouts.
schema_version: 2
role: [data, train, eval]
repos:
  lerobot: ../../external/lerobot
  # Optional: only needed for simulation, not the CPU walkthrough or training.
  sim_repo: ../../external/humanoid_benchmark
  g1_backend: ../../external/g1_backend
paths:
  lerobot_data_root: datasets/lerobot
  lerobot_outputs: outputs/lerobot
  logs: runs
deploy: {}
conda_envs: {}
